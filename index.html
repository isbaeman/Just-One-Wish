<!DOCTYPE html>
<html lang="en" class="locked">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>One Last Wish</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&family=Qwitcher+Grypen:wght@400;700&display=swap"
      rel="stylesheet">

<style>
:root {
    --black: #050505;
    --white: #ede8e2;
    --muted: #b8b1aa;
    --ease: cubic-bezier(.22, .61, .36, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    background: var(--black);
    scroll-behavior: smooth;
}

html.locked,
body.locked {
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

.noto-nastaliq-urdu {
    font-family: "Noto Nastaliq Urdu", serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
}

.qwitcher-grypen-regular {
    font-family: "Qwitcher Grypen", cursive;
    font-weight: 400;
    font-style: normal;
}

#app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: var(--black);
}

#app::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: .045;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    mix-blend-mode: screen;
}

#app::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.28) 72%,
            rgba(0,0,0,.72) 100%
        );
}

.screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--black);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
        opacity 1.8s var(--ease),
        visibility 1.8s var(--ease);
}

.screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* ---------- PASSWORD ---------- */

#passwordScreen {
    z-index: 50;
}

.password-wrap {
    width: min(88vw, 380px);
    text-align: center;
}

.password-title {
    margin-bottom: 34px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 3vw, 22px);
    font-weight: 400;
    letter-spacing: .14em;
    color: var(--white);
    opacity: 0;
    transform: translateY(12px);
    animation: passwordTitleIn 1.6s .3s var(--ease) forwards;
}

.password-form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.password-input {
    width: 100%;
    height: 50px;
    border: 0;
    border-bottom: 1px solid rgba(237,232,226,.22);
    background: transparent;
    outline: none;
    color: var(--white);
    text-align: center;
    font-size: 17px;
    letter-spacing: .18em;
    transition: border-color .5s ease;
}

.password-input::placeholder {
    color: rgba(184,177,170,.42);
    letter-spacing: .08em;
}

.password-input:focus {
    border-bottom-color: rgba(237,232,226,.58);
}

.enter-btn {
    margin-top: 30px;
    min-width: 105px;
    height: 42px;
    border: 1px solid rgba(237,232,226,.18);
    border-radius: 999px;
    background: rgba(255,255,255,.015);
    color: var(--muted);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: .13em;
    cursor: pointer;
    transition:
        color .45s ease,
        border-color .45s ease,
        background .45s ease,
        transform .45s var(--ease);
}

.enter-btn:hover {
    color: var(--white);
    border-color: rgba(237,232,226,.42);
    background: rgba(255,255,255,.04);
    transform: translateY(-1px);
}

.enter-btn:active {
    transform: translateY(0);
}

.password-error {
    min-height: 20px;
    margin-top: 17px;
    color: rgba(184,177,170,.7);
    font-size: 12px;
    letter-spacing: .05em;
    opacity: 0;
    transition: opacity .5s ease;
}

.password-error.show {
    opacity: 1;
}

@keyframes passwordTitleIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- WISH ---------- */

#wishScreen {
    z-index: 40;
}

.wish-title {
    color: var(--white);
    font-family: "Qwitcher Grypen", cursive;
    font-size: clamp(58px, 9vw, 115px);
    font-weight: 400;
    line-height: .8;
    letter-spacing: .015em;
    opacity: 0;
    filter: blur(12px);
    transform: scale(.94);
    transition:
        opacity 3s var(--ease),
        filter 3s var(--ease),
        transform 3s var(--ease);
}

#wishScreen.show-title .wish-title {
    opacity: .95;
    filter: blur(0);
    transform: scale(1);
}

/* ---------- BEGIN ---------- */

#beginScreen {
    z-index: 35;
}
.begin-btn {
    border: 1px solid rgba(237,232,226,.23);
    background: rgba(255,255,255,.012);
    color: var(--white);
    border-radius: 999px;
    min-width: 120px;
    height: 45px;
    padding: 0 25px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: .16em;
    cursor: pointer;
    opacity: 0;
    transition:
        opacity 1.6s ease,
        color .45s ease,
        border-color .45s ease,
        background .45s ease,
        transform .45s var(--ease);
}

#beginScreen.active .begin-btn {
    opacity: 1;
    transition-delay: .6s;
}

.begin-btn:hover {
    color: #fff;
    border-color: rgba(237,232,226,.48);
    background: rgba(255,255,255,.035);
    transform: translateY(-2px);
}

/* ---------- EXPERIENCE ---------- */

#experience {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--black);
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 2s ease,
        visibility 2s ease;
    z-index: 20;
}

#experience.active {
    opacity: 1;
    visibility: visible;
}

#backgroundImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
    background: #050505;
    z-index: 1;
    opacity: 1;
    filter: brightness(.78) contrast(.95) saturate(.85);
    transform: none;
    transition: opacity 3.5s ease;
}

#experience.active #backgroundImage {
    opacity: 1;
    transform: none;
}

@media (max-width: 600px) {
    #backgroundImage {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        opacity: 1;
        filter: brightness(.78) contrast(.95) saturate(.85);
        transform: none;
    }

    #experience.active #backgroundImage {
        opacity: 1;
        transform: none;
    }
}

/* Soft pool of darkness so the lyrics always stay legible. */
.lyric-scrim {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse 78% 42% at 50% 50%,
            rgba(0,0,0,.62) 0%,
            rgba(0,0,0,.38) 45%,
            rgba(0,0,0,0) 78%
        );
}

/* The video now only carries the audio. */
#backgroundVideo {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.video-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.48) 0%,
            rgba(0,0,0,.28) 45%,
            rgba(0,0,0,.62) 100%
        );
}

.video-vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.28) 70%,
            rgba(0,0,0,.78) 100%
        );
}

.lyric-stage {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px clamp(22px, 6vw, 100px);
}

.lyric {
    width: min(1100px, 92vw);
    color: var(--white);
    text-align: center;
    direction: rtl;
    unicode-bidi: plaintext;
    font-family: "Noto Nastaliq Urdu", serif;
    font-size: clamp(27px, 4vw, 53px);
    line-height: 2;
    text-shadow:
        0 2px 20px rgba(0,0,0,.8),
        0 0 45px rgba(0,0,0,.45);
    opacity: 0;
    filter: blur(12px);
    transform: translateY(12px) scale(.96);
    transition:
        opacity 1.1s var(--ease),
        filter 1.1s var(--ease),
        transform 1.3s var(--ease);
}

.lyric.visible {
    opacity: .98;
    filter: blur(0);
    transform: translateY(0) scale(1);
}

/* ---------- ENDING ---------- */

#endingScreen {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #050505;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
        opacity 2.5s ease,
        visibility 2.5s ease;
}

#endingScreen.active {
    opacity: 1;
    visibility: visible;
}

.scroll-indicator {
    position: absolute;
    left: 50%;
    bottom: 8vh;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    transition: opacity 3s ease;
}

#endingScreen.show-indicator .scroll-indicator {
    opacity: 1;
}

.scroll-arrow {
    display: block;
    margin-bottom: 12px;
    color: rgba(237,232,226,.62);
    font-family: Georgia, serif;
    font-size: 20px;
    animation: arrowFloat 2.6s ease-in-out infinite;
}

.scroll-text {
    color: rgba(184,177,170,.55);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: lowercase;
}

@keyframes arrowFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(6px); }
}

/* ---------- SCROLL LINE + CLICK TO READ ---------- */

/* A thin line with a soft light drifting down it. */
.scroll-line {
    position: relative;
    display: block;
    width: 1px;
    height: 46px;
    margin: 18px auto 0;
    overflow: hidden;
    background: linear-gradient(
        180deg,
        rgba(237,232,226,0),
        rgba(237,232,226,.2) 50%,
        rgba(237,232,226,0)
    );
}

.scroll-line::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 45%;
    background: linear-gradient(
        180deg,
        rgba(237,232,226,0),
        rgba(237,232,226,.85),
        rgba(237,232,226,0)
    );
    transform: translateY(-100%);
    opacity: 0;
    animation: scrollLineFlow 3s var(--ease) infinite;
}

@keyframes scrollLineFlow {
    0%   { transform: translateY(-100%); opacity: 0; }
    25%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { transform: translateY(230%);  opacity: 0; }
}

.read-btn {
    display: block;
    margin: 26px auto 0;
    min-width: 150px;
    height: 46px;
    padding: 0 30px;
    border: 1px solid rgba(237,232,226,.23);
    border-radius: 999px;
    background: rgba(255,255,255,.012);
    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: .16em;
    white-space: nowrap;
    cursor: pointer;
    /* The ending screen ignores pointer events, so the button
       switches them on itself once the indicator has faded in. */
    pointer-events: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    animation: readGlow 4.2s ease-in-out infinite;
    transition:
        color .45s ease,
        border-color .45s ease,
        background .45s ease,
        box-shadow .45s ease,
        transform .45s var(--ease);
}

#endingScreen.show-indicator .read-btn {
    pointer-events: auto;
}

@keyframes readGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(237,232,226,0); }
    50%      { box-shadow: 0 0 22px rgba(237,232,226,.07); }
}

.read-btn:focus-visible {
    outline: none;
    color: #fff;
    border-color: rgba(237,232,226,.48);
    background: rgba(255,255,255,.035);
}

/* Hover only where a real pointer exists, so phones never get a stuck hover. */
@media (hover: hover) {
    .read-btn:hover {
        color: #fff;
        border-color: rgba(237,232,226,.48);
        background: rgba(255,255,255,.035);
        box-shadow: 0 0 28px rgba(237,232,226,.12);
        transform: translateY(-2px);
        animation: none;
    }
}

/* Press / tap */
.read-btn:active {
    color: #fff;
    border-color: rgba(237,232,226,.55);
    background: rgba(255,255,255,.06);
    box-shadow: 0 0 30px rgba(237,232,226,.14);
    transform: scale(.96);
    animation: none;
}

@media (max-width: 600px) {
    .scroll-line {
        height: 40px;
        margin-top: 15px;
    }

    .read-btn {
        min-width: 146px;
        height: 44px;
        margin-top: 22px;
        padding: 0 26px;
    }
}

/* ---------- SCROLL HOST + LETTER ---------- */

#scrollHost {
    position: relative;
    width: 100%;
    z-index: 10;
}

.scroll-spacer {
    width: 100%;
    height: 100vh;
}

#letterSection {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: #050505;
    padding: 22vh clamp(28px, 8vw, 130px) 24vh;
    display: flex;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 2s ease,
        visibility 2s ease;
}

#letterSection.revealed {
    opacity: 1;
    visibility: visible;
}

.letter-wrap {
    position: relative;
    width: min(760px, 90vw);
    display: flex;
    flex-direction: column;
}

.letter-line {
    margin: 0 0 30px;
    color: rgba(237,232,226,.87);
    font-family: "Qwitcher Grypen", cursive;
    font-size: clamp(31px, 4vw, 50px);
    line-height: 1.15;
    letter-spacing: .01em;
    opacity: 0;
    filter: blur(8px);
    transform: translateY(25px);
    transition:
        opacity 1.8s var(--ease),
        filter 1.8s var(--ease),
        transform 1.8s var(--ease);
}

.letter-line.visible {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
}

.letter-gap {
    height: 35px;
}

.signature {
    align-self: flex-end;
    margin-top: 14vh;
    color: rgba(237,232,226,.88);
    font-family: "Qwitcher Grypen", cursive;
    font-size: clamp(42px, 6vw, 68px);
    line-height: 1;
    transform: rotate(-4deg);
    opacity: 0;
    filter: blur(7px);
    transition:
        opacity 2s ease,
        filter 2s ease;
}

.signature.visible {
    opacity: 1;
    filter: blur(0);
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 900px) {
    .lyric {
        font-size: clamp(25px, 5vw, 42px);
    }

    .letter-line {
        font-size: clamp(29px, 6vw, 46px);
    }
}

@media (max-width: 600px) {
    .password-wrap { width: 82vw; }

    .password-title {
        font-size: 17px;
        margin-bottom: 29px;
    }

    .password-input {
        height: 48px;
        font-size: 15px;
    }

    .enter-btn {
        margin-top: 26px;
        height: 44px;
        min-width: 108px;
    }

    .wish-title {
        width: 90vw;
        font-size: clamp(56px, 17vw, 88px);
    }

    .lyric-stage {
        padding:
            calc(30px + env(safe-area-inset-top, 0px))
            22px
            calc(45px + env(safe-area-inset-bottom, 0px));
    }

    /* Only the size is adapted for phones; line-height and shadow follow the desktop. */
    .lyric {
        width: 92vw;
        font-size: clamp(22px, 6.4vw, 31px);
    }

    /*
       The background picture now looks exactly like the desktop one
       (same fit, position and brightness), so nothing is overridden here.
    */

    .lyric-scrim {
        background:
            radial-gradient(
                ellipse 96% 34% at 50% 50%,
                rgba(0,0,0,.72) 0%,
                rgba(0,0,0,.45) 50%,
                rgba(0,0,0,0) 82%
            );
    }

    .scroll-indicator { bottom: 6vh; }

    .scroll-arrow {
        font-size: 19px;
        margin-bottom: 9px;
    }

    .scroll-text {
        font-size: 10px;
        letter-spacing: .17em;
    }

    #letterSection {
        padding: 20vh 24px 22vh;
    }

    .letter-line {
        margin-bottom: 27px;
        font-size: clamp(30px, 9vw, 43px);
        line-height: 1.18;
    }

    .letter-gap { height: 27px; }

    .signature {
        margin-top: 12vh;
        font-size: clamp(42px, 13vw, 62px);
    }
}

@media (max-width: 380px) {
    .lyric { font-size: 21px; }
    .letter-line { font-size: 29px; }
    .signature { font-size: 43px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body class="locked">

<div id="app">

    <section id="passwordScreen" class="screen active">
        <div class="password-wrap">

            <div class="password-title">Enter Password</div>

            <form id="passwordForm" class="password-form">

                <input
                    id="passwordInput"
                    class="password-input"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Password"
                    placeholder="••••••••">

                <button type="submit" class="enter-btn">Enter</button>

                <div id="passwordError" class="password-error" aria-live="polite">
                    That isn't the right password.
                </div>

            </form>
        </div>
    </section>


    <section id="wishScreen" class="screen">
        <div class="wish-content">
            <div class="wish-title qwitcher-grypen-regular">One Last Wish</div>
        </div>
    </section>


    <section id="beginScreen" class="screen">
        <div class="begin-wrap">
            <button id="beginButton" class="begin-btn" type="button">Begin</button>
        </div>
    </section>


    <main id="experience">

        <img
            id="backgroundImage"
            src="pic.png"
            alt=""
            aria-hidden="true">

        <video
            id="backgroundVideo"
            src="Theher Ja(KoshalWorld.Com).mp3"
            poster="cover.jpg"
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"></video>

        <div class="video-overlay"></div>
        <div class="video-vignette"></div>
        <div class="lyric-scrim"></div>

        <div class="lyric-stage">
            <div id="lyric" class="lyric noto-nastaliq-urdu"></div>
        </div>

    </main>


    <section id="endingScreen">
        <div class="scroll-indicator">
            <span class="scroll-arrow">↓</span>
            <span class="scroll-text">scroll down</span>
            <span class="scroll-line" aria-hidden="true"></span>
            <button id="readButton" class="read-btn" type="button">CLICK TO READ</button>
        </div>
    </section>


    <div id="scrollHost">

        <div class="scroll-spacer"></div>

        <section id="letterSection">
            <div class="letter-wrap">

                <p class="letter-line">Maybe some things are better left unsaid.</p>
                <p class="letter-line">Maybe some feelings are meant to stay</p>
                <p class="letter-line">between the words,</p>
                <p class="letter-line">the silence,</p>
                <p class="letter-line">and the memories.</p>

                <div class="letter-gap"></div>

                <p class="letter-line">So this isn't goodbye.</p>
                <p class="letter-line">Just one last wish...</p>
                <p class="letter-line">Stay.</p>

                <div id="signature" class="signature qwitcher-grypen-regular">
                    Isba Eman
                </div>

            </div>
        </section>

    </div>

</div>


<script>

const PASSWORD = "2322007";

    { time: 100, text: "بہتی ہواؤں کو روک نہیں، پر سانسوں میں بھر سکتے ہو" },
    { time: 110, text: "دل سے نکلتا نہ کوئی کسی کے، پر کھونے سے ڈر سکتے ہو" },
    { time: 120, text: "کہنے کو کتنا بچا، کیسے کروں میں بیاں" },
    { time: 130, text: "ہم ملیں گے پھر سے کبھی، آسمان پہ ہوگی جگہ" },
    { time: 140, text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا" },
    { time: 150, text: "ادھورا سا یہ گھر لگے گا تیرے بنا" },
    { time: 160, text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا" },
    { time: 170, text: "ادھورا سا یہ گھر لگے گا تیرے بنا" }
];

/*
   The song starts the moment "Begin" is pressed.
   The first lyric waits this many seconds after that.
   Change 5 to any number to move all lines together.
*/
const LYRIC_START_DELAY = 10;

/* How long the last line stays before the screen goes black. */
const TAIL_SECONDS = 7;

const passwordScreen = document.getElementById("passwordScreen");
const passwordForm   = document.getElementById("passwordForm");
const passwordInput  = document.getElementById("passwordInput");
const passwordError  = document.getElementById("passwordError");
const wishScreen     = document.getElementById("wishScreen");
const beginScreen    = document.getElementById("beginScreen");
const beginButton    = document.getElementById("beginButton");
const experience     = document.getElementById("experience");
const video          = document.getElementById("backgroundVideo");
const lyricElement   = document.getElementById("lyric");
const endingScreen   = document.getElementById("endingScreen");
const letterSection  = document.getElementById("letterSection");
const letterLines    = document.querySelectorAll(".letter-line");
const signature      = document.getElementById("signature");
const readButton     = document.getElementById("readButton");

let currentLyricIndex  = -1;
let experienceStarted  = false;
let endingStarted      = false;
let letterOpened       = false;
let usingFallbackClock = false;
let clockStart         = 0;


/* ============================ PASSWORD ============================ */

passwordForm.addEventListener("submit", function (event) {

    event.preventDefault();

    if (passwordInput.value.trim() === PASSWORD) {

        passwordError.classList.remove("show");
        passwordScreen.classList.remove("active");

        /* Warm the media file up while the title plays. */
        try { video.load(); } catch (e) {}

        setTimeout(() => {

            wishScreen.classList.add("active");

            requestAnimationFrame(() => {
                wishScreen.classList.add("show-title");
            });

            setTimeout(() => {

                wishScreen.classList.remove("show-title");

                setTimeout(() => {

                    wishScreen.classList.remove("active");

                    setTimeout(() => {
                        beginScreen.classList.add("active");
                    }, 900);

                }, 2200);

            }, 3900);

        }, 1000);

    } else {

        passwordError.classList.add("show");
        passwordInput.value = "";
        passwordInput.focus();

        passwordInput.animate(
            [
                { transform: "translateX(0)" },
                { transform: "translateX(-5px)" },
                { transform: "translateX(5px)" },
                { transform: "translateX(-3px)" },
                { transform: "translateX(0)" }
            ],
            { duration: 380, easing: "ease-out" }
        );
    }

});


/* ============================ BEGIN ============================ */

beginButton.addEventListener("click", function () {

    if (experienceStarted) return;
    experienceStarted = true;

    /*
       play() must be called SYNCHRONOUSLY inside this click,
       otherwise browsers treat it as autoplay and block it.
    */
    let played = false;

    try {
        video.currentTime = 0;
    } catch (e) {}

    const playPromise = video.play();

    if (playPromise && typeof playPromise.then === "function") {
        playPromise
            .then(() => { played = true; })
            .catch(() => { startFallbackClock(); });
    } else {
        played = true;
    }

    beginScreen.classList.remove("active");

    setTimeout(() => {
        experience.classList.add("active");
    }, 850);

    /* Safety net: if the video never actually starts, run on a timer. */
    setTimeout(() => {
        if (video.paused || video.currentTime === 0) {
            startFallbackClock();
        }
    }, 1800);

    startLoop();

});

video.addEventListener("error", startFallbackClock);
video.addEventListener("stalled", function () {
    if (experienceStarted && video.currentTime === 0) startFallbackClock();
});

/*
   On slower phone connections the audio can take longer than the safety
   net above to start. As soon as it really plays, go back to the audio
   clock so lyrics stay in step with the music like on desktop.
*/
video.addEventListener("playing", function () {
    usingFallbackClock = false;
});

function startFallbackClock() {
    if (usingFallbackClock || endingStarted) return;
    usingFallbackClock = true;
    clockStart = performance.now();
}


/* ============================ CLOCK ============================ */

function getTime() {
    if (usingFallbackClock) {
        return (performance.now() - clockStart) / 1000;
    }
    return video.currentTime;
}

function getLyricIndex(t) {
    // The lyric times are used exactly as written (no stretching to the
    // audio length), so every lyric stays on screen for a constant 10 seconds.
    const scale = 1;
    const shifted = t - LYRIC_START_DELAY;
    let index = -1;
    for (let i = 0; i < lyrics.length; i++) {
        if (shifted >= lyrics[i].time * scale) index = i;
        else break;
    }
    return index;
}

function showLyric(index) {

    if (index < 0 || index >= lyrics.length) return;

    lyricElement.classList.remove("visible");

    setTimeout(() => {

        lyricElement.textContent = lyrics[index].text;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                lyricElement.classList.add("visible");
            });
        });

    }, 400);
}

function startLoop() {

    function tick() {

        if (!experienceStarted || endingStarted) return;

        const t = getTime();
        const index = getLyricIndex(t);

        if (index !== currentLyricIndex) {
            currentLyricIndex = index;
            if (index >= 0) showLyric(index);
        }

        // Let the audio finish naturally; use the duration as a fallback
        // if an ended event is not delivered by the browser.
        if (Number.isFinite(video.duration) && video.duration > 0 &&
            t >= video.duration - 0.25) {
            beginEnding();
            return;
        }

        requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
}

video.addEventListener("ended", beginEnding);


/* ============================ ENDING ============================ */

function beginEnding() {

    if (endingStarted) return;
    endingStarted = true;

    lyricElement.classList.remove("visible");

    setTimeout(() => {

        try { video.pause(); } catch (e) {}

        experience.classList.remove("active");

        setTimeout(() => {

            endingScreen.classList.add("active");

            /* Unlock scrolling only now. */
            document.documentElement.classList.remove("locked");
            document.body.classList.remove("locked");

            setTimeout(() => {
                endingScreen.classList.add("show-indicator");
            }, 2800);

        }, 1700);

    }, 1300);
}


/* ============================ LETTER ============================ */

function openLetter() {

    if (letterOpened || !endingStarted) return;
    letterOpened = true;

    endingScreen.classList.remove("active");
    letterSection.classList.add("revealed");

    /* Animate the lines only once the letter is actually visible. */
    letterLines.forEach(line => letterObserver.observe(line));
    signatureObserver.observe(signature);
}

window.addEventListener("scroll", function () {

    if (!endingStarted || letterOpened) return;

    if (window.scrollY > window.innerHeight * .2) {
        openLetter();
    }

}, { passive: true });

/* "CLICK TO READ" does the same thing scrolling does, then glides to the letter. */
readButton.addEventListener("click", function () {

    if (!endingStarted) return;

    openLetter();

    window.scrollTo({
        top: letterSection.getBoundingClientRect().top + window.scrollY,
        behavior: "smooth"
    });

});

const letterObserver = new IntersectionObserver(
    (entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                letterObserver.unobserve(entry.target);
            }
        });
    },
    { threshold: .2, rootMargin: "0px 0px -6% 0px" }
);

const signatureObserver = new IntersectionObserver(
    (entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                signature.classList.add("visible");
                signatureObserver.unobserve(signature);
            }
        });
    },
    { threshold: .4 }
);


/* ============================ MISC ============================ */

passwordInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        passwordForm.requestSubmit();
    }
});

experience.addEventListener("contextmenu", function (event) {
    event.preventDefault();
});

</script>
