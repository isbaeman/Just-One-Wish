<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Cinematic Lyrics</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root {
    --bg: #080808;
    --panel: rgba(20, 20, 20, 0.72);
    --panel-light: rgba(255, 255, 255, 0.08);
    --text: #f5f5f5;
    --muted: rgba(255,255,255,.45);
    --line: rgba(255,255,255,.12);
    --accent: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", sans-serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -5;
    overflow: hidden;
    background: #050505;
}

.background-image {
    position: absolute;
    inset: -8%;
    background:
        linear-gradient(
            rgba(0,0,0,.78),
            rgba(0,0,0,.92)
        ),
        url("cover.jpg") center / cover no-repeat;
    filter: blur(35px);
    transform: scale(1.1);
    opacity: .7;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.07),
            transparent 35%
        ),
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.8)
        );
}

/* subtle atmosphere */

.ambient {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,.025);
    filter: blur(100px);
    animation: ambientMove 12s ease-in-out infinite alternate;
}

.ambient.one {
    top: 5%;
    left: -10%;
}

.ambient.two {
    bottom: -15%;
    right: -10%;
    animation-delay: -5s;
}

@keyframes ambientMove {
    from {
        transform: translate3d(-20px, -10px, 0);
    }
    to {
        transform: translate3d(30px, 25px, 0);
    }
}

/* =========================
   PAGE
========================= */

.page {
    width: min(1200px, 94%);
    margin: auto;
    padding: 55px 0 80px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 38px;
    animation: pageIn .9s ease both;
}

.eyebrow {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 10px;
    margin-bottom: 13px;
}

.title {
    font-family: "Playfair Display", serif;
    font-size: clamp(34px, 6vw, 66px);
    font-weight: 500;
    letter-spacing: -.5px;
    line-height: 1.05;
}

.artist {
    color: rgba(255,255,255,.55);
    margin-top: 12px;
    font-size: 14px;
    letter-spacing: 1.5px;
}

.meta {
    margin-top: 15px;
    color: rgba(255,255,255,.3);
    font-size: 11px;
    letter-spacing: 1px;
}

/* =========================
   VIDEO
========================= */

.video-section {
    position: relative;
    animation: videoIn 1s cubic-bezier(.2,.8,.2,1) both;
}

.video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 22px;
    overflow: hidden;

    background: #000;

    box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);

    isolation: isolate;
}

video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* video dark cinematic layer */

.video-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            transparent 35%,
            rgba(0,0,0,.18)
        );
}

/* =========================
   CENTER PLAY
========================= */

.center-play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;

    background: rgba(0,0,0,.35);
    backdrop-filter: blur(14px);

    color: white;
    cursor: pointer;

    display: grid;
    place-items: center;

    transition:
        opacity .3s ease,
        transform .3s ease,
        background .3s ease;
}

.center-play:hover {
    background: rgba(255,255,255,.12);
    transform: translate(-50%, -50%) scale(1.08);
}

.center-play.hidden {
    opacity: 0;
    pointer-events: none;
}

.play-icon {
    width: 0;
    height: 0;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 14px solid white;
    margin-left: 4px;
}

/* =========================
   CUSTOM CONTROLS
========================= */

.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;

    padding: 55px 18px 16px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.8),
            transparent
        );

    opacity: 0;
    transition: opacity .3s ease;
}

.video-frame:hover .controls,
.video-frame.controls-visible .controls {
    opacity: 1;
}

.progress-area {
    position: relative;
    height: 4px;
    cursor: pointer;
    margin-bottom: 14px;
}

.progress-track {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: rgba(255,255,255,.2);
}

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: white;
}

.controls-row {
    display: flex;
    align-items: center;
    gap: 13px;
}

.control-btn {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 50%;

    color: white;
    background: transparent;

    cursor: pointer;

    display: grid;
    place-items: center;

    transition: background .2s ease, transform .2s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.1);
    transform: scale(1.06);
}

.time {
    color: rgba(255,255,255,.7);
    font-size: 11px;
    min-width: 90px;
}

.volume {
    width: 75px;
    accent-color: white;
}

.spacer {
    flex: 1;
}

/* =========================
   LYRICS
========================= */

.lyrics-wrapper {
    margin-top: 55px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 45px;

    align-items: start;
}

.lyrics-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(255,255,255,.35);
    margin-bottom: 18px;
}

.lyrics-container {
    position: relative;

    height: 500px;
    overflow-y: auto;

    padding: 180px 10px;

    scroll-behavior: smooth;

    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
}

.lyrics-container::-webkit-scrollbar {
    width: 4px;
}

.lyrics-container::-webkit-scrollbar-track {
    background: transparent;
}

.lyrics-container::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.15);
    border-radius: 10px;
}

.lyric-line {
    position: relative;

    padding: 12px 15px;
    margin: 5px 0;

    color: rgba(255,255,255,.22);

    font-family: "Playfair Display", serif;
    font-size: clamp(22px, 3vw, 34px);
    line-height: 1.3;

    cursor: pointer;

    transition:
        color .45s ease,
        opacity .45s ease,
        transform .45s cubic-bezier(.2,.8,.2,1),
        filter .45s ease;

    transform-origin: left center;
}

.lyric-line:hover {
    color: rgba(255,255,255,.55);
}

.lyric-line.previous {
    color: rgba(255,255,255,.48);
}

.lyric-line.active {
    color: white;
    transform: scale(1.035);
    filter: drop-shadow(0 5px 25px rgba(255,255,255,.08));
}

.lyric-line.next {
    color: rgba(255,255,255,.28);
}

/* =========================
   SIDE INFO
========================= */

.song-info {
    position: sticky;
    top: 35px;

    padding: 24px;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;

    background: rgba(255,255,255,.035);
    backdrop-filter: blur(18px);

    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.cover {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    object-fit: cover;

    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}

.info-title {
    margin-top: 20px;

    font-family: "Playfair Display", serif;
    font-size: 23px;
}

.info-artist {
    margin-top: 6px;

    color: rgba(255,255,255,.45);
    font-size: 13px;
}

.info-divider {
    height: 1px;
    background: rgba(255,255,255,.08);
    margin: 22px 0;
}

.info-row {
    display: flex;
    justify-content: space-between;

    font-size: 11px;
    margin: 12px 0;
}

.info-label {
    color: rgba(255,255,255,.3);
}

.info-value {
    color: rgba(255,255,255,.65);
}

/* =========================
   EMPTY / LOADING
========================= */

.loading {
    position: fixed;
    inset: 0;
    z-index: 100;

    background: #050505;

    display: grid;
    place-items: center;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

.loading.hidden {
    opacity: 0;
    visibility: hidden;
}

.loader-content {
    text-align: center;
}

.loader-title {
    font-family: "Playfair Display", serif;
    font-size: 28px;
}

.loader-line {
    width: 100px;
    height: 1px;

    background: rgba(255,255,255,.25);

    margin: 18px auto;

    overflow: hidden;
}

.loader-line::after {
    content: "";
    display: block;

    height: 100%;
    width: 40%;

    background: white;

    animation: loader 1.2s ease-in-out infinite;
}

@keyframes loader {
    0% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(350%);
    }
}

/* =========================
   ANIMATIONS
========================= */

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes videoIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .page {
        width: 92%;
        padding-top: 30px;
        padding-bottom: 45px;
    }

    .header {
        margin-bottom: 25px;
    }

    .eyebrow {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .title {
        font-size: clamp(32px, 10vw, 48px);
    }

    .artist {
        font-size: 12px;
    }

    .video-frame {
        border-radius: 15px;
    }

    .controls {
        opacity: 1;
        padding: 45px 10px 9px;
    }

    .volume {
        display: none;
    }

    .time {
        font-size: 10px;
        min-width: 80px;
    }

    .lyrics-wrapper {
        display: block;

    }

    .song-info {
        display: none;
    }

    .lyrics-container {
        height: 55vh;

        padding-top: 180px;

        margin-left: -5px;
        margin-right: -5px;
    }

    .lyrics-heading {
        margin-bottom: 5px;
    }

    .lyric-line {
        font-size: clamp(23px, 7vw, 31px);
        padding: 13px 8px;
    }

    .center-play {
        width: 62px;
        height: 62px;
    }
}

@media (max-width: 480px) {

    .page {
        width: 94%;
    }

    .video-frame {
        border-radius: 12px;
    }

    .controls-row {
        gap: 5px;
    }

    .control-btn {
        width: 32px;
        height: 32px;
    }

    .time {
        min-width: 75px;
    }

    .lyrics-container {
        height: 58vh;
    }
}
</style>

<script>

/* =====================================================
   LYRICS DATA

   Add your lyrics here.

   Example:

   { time: 5.0, text: "First line" }

   Time is measured in seconds.
===================================================== */

const lyrics = [

    { time: 0.0, text: "♪ Music begins ♪" },

    { time: 5.0, text: "First line of the song" },

    { time: 8.5, text: "Second line of the song" },

    { time: 12.0, text: "Third line of the song" },

    { time: 16.5, text: "Another beautiful line" },

    { time: 20.0, text: "Your next lyric goes here" },

    { time: 24.0, text: "Keep adding your lyrics" },

    { time: 28.0, text: "The timing stays synchronized" },

    { time: 32.0, text: "♪ Instrumental ♪" }

];


/* =====================================================
   ELEMENTS
===================================================== */

const video = document.getElementById("video");

const videoFrame =
    document.getElementById("videoFrame");

const centerPlay =
    document.getElementById("centerPlay");

const playBtn =
    document.getElementById("playBtn");

const progressArea =
    document.getElementById("progressArea");

const progressFill =
    document.getElementById("progressFill");

const timeDisplay =
    document.getElementById("timeDisplay");

const volume =
    document.getElementById("volume");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const lyricsContainer =
    document.getElementById("lyricsContainer");

const loading =
    document.getElementById("loading");


/* =====================================================
   CREATE LYRIC ELEMENTS
===================================================== */

lyrics.forEach((lyric, index) => {

    const element =
        document.createElement("div");

    element.className = "lyric-line";

    element.textContent = lyric.text;

    element.dataset.index = index;

    /*
       Clicking a lyric jumps
       directly to its timestamp.
    */

    element.addEventListener("click", () => {

        video.currentTime = lyric.time;

        /*
           If the video was paused,
           keep it paused.
        */

        updateLyrics();

    });

    lyricsContainer.appendChild(element);

});


const lyricElements =
    [...document.querySelectorAll(".lyric-line")];


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay() {

    if (video.paused) {

        video.play().catch(() => {});

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);


/* =====================================================
   VIDEO STATE
===================================================== */

video.addEventListener("play", () => {

    playBtn.textContent = "❚❚";

    centerPlay.classList.add("hidden");

});


video.addEventListener("pause", () => {

    playBtn.textContent = "▶";

    centerPlay.classList.remove("hidden");

});


video.addEventListener("ended", () => {

    playBtn.textContent = "▶";

    centerPlay.classList.remove("hidden");

});


/* =====================================================
   PROGRESS
===================================================== */

video.addEventListener("timeupdate", () => {

    if (!video.duration) return;

    const percentage =
        (video.currentTime / video.duration) * 100;

    progressFill.style.width =
        percentage + "%";

    timeDisplay.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(video.duration);

    updateLyrics();

});


video.addEventListener("loadedmetadata", () => {

    timeDisplay.textContent =
        "0:00 / " +
        formatTime(video.duration);

});


/* =====================================================
   SEEK
===================================================== */

progressArea.addEventListener("click", (event) => {

    if (!video.duration) return;

    const rect =
        progressArea.getBoundingClientRect();

    const position =
        (event.clientX - rect.left) /
        rect.width;

    video.currentTime =
        position * video.duration;

    updateLyrics();

});


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener("input", () => {

    video.volume =
        Number(volume.value);

});


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoFrame.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            /*
               Some mobile browsers don't support
               normal fullscreen requests.
            */

            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }

        }

    }
);


/* =====================================================
   SYNCHRONIZED LYRICS
===================================================== */

let currentLyricIndex = -1;

function getCurrentLyricIndex(time) {

    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {

        if (time >= lyrics[i].time) {
            index = i;
        } else {
            break;
        }

    }

    return index;

}


function updateLyrics() {

    const index =
        getCurrentLyricIndex(video.currentTime);

    if (index === currentLyricIndex) {
        return;
    }

    currentLyricIndex = index;


    lyricElements.forEach(
        (element, i) => {

            element.classList.remove(
                "active",
                "previous",
                "next"
            );

            if (i < index) {

                element.classList.add("previous");

            } else if (i === index) {

                element.classList.add("active");

            } else {

                element.classList.add("next");

            }

        }
    );


    /*
       Automatically center
       active lyric.
    */

    if (index >= 0) {

        const active =
            lyricElements[index];

        active.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
    "keydown",
    (event) => {

        /*
           Don't trigger shortcuts while
           interacting with sliders.
        */

        if (
            event.target.tagName === "INPUT"
        ) {
            return;
        }


        if (event.code === "Space") {

            event.preventDefault();

            togglePlay();

        }


        if (event.code === "ArrowRight") {

            video.currentTime += 5;

        }


        if (event.code === "ArrowLeft") {

            video.currentTime -= 5;

        }

    }
);


/* =====================================================
   SHOW CONTROLS AFTER INTERACTION
===================================================== */

let controlsTimeout;

videoFrame.addEventListener(
    "mousemove",
    () => {

        videoFrame.classList.add(
            "controls-visible"
        );

        clearTimeout(controlsTimeout);

        controlsTimeout =
            setTimeout(() => {

                if (!video.paused) {

                    videoFrame.classList.remove(
                        "controls-visible"
                    );

                }

            }, 2500);

    }
);


/* =====================================================
   TOUCH CONTROLS
===================================================== */

videoFrame.addEventListener(
    "touchstart",
    () => {

        videoFrame.classList.add(
            "controls-visible"
        );

        clearTimeout(controlsTimeout);

        controlsTimeout =
            setTimeout(() => {

                if (!video.paused) {

                    videoFrame.classList.remove(
                        "controls-visible"
                    );

                }

            }, 3000);

    },
    { passive: true }
);


/* =====================================================
   LOADING SCREEN
===================================================== */

let pageReady = false;
let videoReady = false;

function hideLoader() {

    if (!pageReady || !videoReady) {
        return;
    }

    setTimeout(() => {

        loading.classList.add("hidden");

    }, 500);

}


window.addEventListener(
    "load",
    () => {

        pageReady = true;

        hideLoader();

    }
);


video.addEventListener(
    "loadeddata",
    () => {

        videoReady = true;

        hideLoader();

    }
);


/*
   Fallback in case the video
   is unavailable.
*/

video.addEventListener(
    "error",
    () => {

        videoReady = true;

        hideLoader();

    }
);


/* =====================================================
   INITIAL STATE
===================================================== */

video.volume = 1;

updateLyrics();
