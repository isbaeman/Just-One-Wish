<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>One Last Wish</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&family=Qwitcher+Grypen:wght@400;700&display=swap"
      rel="stylesheet">

<style>
/* =========================================================
   ROOT
========================================================= */

:root {
    --black: #050505;
    --black-soft: #0a0a0a;
    --dark: #111111;
    --dark-soft: #181818;

    --white: #ede8e2;
    --muted: #b8b1aa;

    --ease: cubic-bezier(.22, .61, .36, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--black);
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================================================
   FONTS
========================================================= */

.noto-nastaliq-urdu {
    font-family: "Noto Nastaliq Urdu", serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
}

.qwitcher-grypen-regular {
    font-family: "Qwitcher Grypen", cursive;
    font-weight: 400;
    font-style: normal;
}

.qwitcher-grypen-bold {
    font-family: "Qwitcher Grypen", cursive;
    font-weight: 700;
    font-style: normal;
}

/* =========================================================
   GLOBAL ATMOSPHERE
========================================================= */

#app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: var(--black);
}

#app::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: .045;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

    mix-blend-mode: screen;
}

#app::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.28) 72%,
            rgba(0,0,0,.72) 100%
        );
}

/* =========================================================
   SCREENS
========================================================= */

.screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--black);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 1.8s var(--ease),
        visibility 1.8s var(--ease);
}

.screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

/* =========================================================
   PASSWORD
========================================================= */

#passwordScreen {
    z-index: 50;
}

.password-wrap {
    width: min(88vw, 380px);
    text-align: center;
}

.password-title {
    margin-bottom: 34px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 3vw, 22px);
    font-weight: 400;
    letter-spacing: .14em;

    color: var(--white);

    opacity: 0;
    transform: translateY(12px);

    animation: passwordTitleIn 1.6s 0.3s var(--ease) forwards;
}

.password-form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.password-input {
    width: 100%;
    height: 50px;

    border: 0;
    border-bottom: 1px solid rgba(237,232,226,.22);

    background: transparent;
    outline: none;

    color: var(--white);

    text-align: center;
    font-size: 17px;
    letter-spacing: .18em;

    transition:
        border-color .5s ease,
        box-shadow .5s ease;
}

.password-input::placeholder {
    color: rgba(184,177,170,.42);
    letter-spacing: .08em;
}

.password-input:focus {
    border-bottom-color: rgba(237,232,226,.58);
}

.enter-btn {
    margin-top: 30px;

    min-width: 105px;
    height: 42px;

    border: 1px solid rgba(237,232,226,.18);
    border-radius: 999px;

    background: rgba(255,255,255,.015);

    color: var(--muted);

    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: .13em;

    cursor: pointer;

    transition:
        color .45s ease,
        border-color .45s ease,
        background .45s ease,
        transform .45s var(--ease);
}

.enter-btn:hover {
    color: var(--white);
    border-color: rgba(237,232,226,.42);
    background: rgba(255,255,255,.04);
    transform: translateY(-1px);
}

.enter-btn:active {
    transform: translateY(0);
}

.password-error {
    min-height: 20px;
    margin-top: 17px;

    color: rgba(184,177,170,.7);

    font-size: 12px;
    letter-spacing: .05em;

    opacity: 0;
    transition: opacity .5s ease;
}

.password-error.show {
    opacity: 1;
}

@keyframes passwordTitleIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   WISH SCREEN
========================================================= */

#wishScreen {
    z-index: 40;
    background: var(--black);
}

.wish-content {
    position: relative;
    text-align: center;
}

.wish-title {
    color: var(--white);

    font-family: "Qwitcher Grypen", cursive;

    font-size: clamp(58px, 9vw, 115px);
    font-weight: 400;

    line-height: .8;

    letter-spacing: .015em;

    opacity: 0;
    filter: blur(12px);
    transform: scale(.94);

    transition:
        opacity 3s var(--ease),
        filter 3s var(--ease),
        transform 3s var(--ease);
}

#wishScreen.show-title .wish-title {
    opacity: .95;
    filter: blur(0);
    transform: scale(1);
}

/* =========================================================
   BEGIN SCREEN
========================================================= */

#beginScreen {
    z-index: 35;
    background: var(--black);
}

.begin-wrap {
    text-align: center;
}

.begin-btn {
    border: 1px solid rgba(237,232,226,.23);

    background: rgba(255,255,255,.012);

    color: var(--white);

    border-radius: 999px;

    min-width: 120px;
    height: 45px;

    padding: 0 25px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;

    letter-spacing: .16em;

    cursor: pointer;

    opacity: 0;

    transition:
        opacity 1.6s ease,
        color .45s ease,
        border-color .45s ease,
        background .45s ease,
        transform .45s var(--ease);
}

#beginScreen.active .begin-btn {
    opacity: 1;
    transition-delay: .6s;
}

.begin-btn:hover {
    color: #fff;
    border-color: rgba(237,232,226,.48);
    background: rgba(255,255,255,.035);
    transform: translateY(-2px);
}

.begin-btn:active {
    transform: translateY(0);
}

/* =========================================================
   EXPERIENCE
========================================================= */

#experience {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: var(--black);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 2s ease,
        visibility 2s ease;

    z-index: 20;
}

#experience.active {
    opacity: 1;
    visibility: visible;
}

/* =========================================================
   VIDEO BACKGROUND
========================================================= */

#backgroundVideo {
    position: absolute;
    inset: -3%;

    width: 106%;
    height: 106%;

    object-fit: cover;

    opacity: 0;

    filter:
        brightness(.25)
        contrast(.88)
        saturate(.55)
        blur(1.2px);

    transform: scale(1.025);

    transition:
        opacity 3s ease,
        transform 20s linear;
}

#experience.active #backgroundVideo {
    opacity: .75;
    transform: scale(1.075);
}

/* =========================================================
   BACKGROUND OVERLAY
========================================================= */

.video-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.48) 0%,
            rgba(0,0,0,.28) 45%,
            rgba(0,0,0,.62) 100%
        );

    z-index: 2;
}

.video-vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.28) 70%,
            rgba(0,0,0,.78) 100%
        );

    z-index: 3;
}

/* =========================================================
   LYRIC AREA
========================================================= */

.lyric-stage {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        40px
        clamp(22px, 6vw, 100px);
}

.lyric {
    width: min(1100px, 92vw);

    color: var(--white);

    text-align: center;

    font-family: "Noto Nastaliq Urdu", serif;

    font-size: clamp(27px, 4vw, 53px);

    line-height: 2;

    letter-spacing: .01em;

    text-shadow:
        0 2px 20px rgba(0,0,0,.8),
        0 0 45px rgba(0,0,0,.45);

    opacity: 0;

    filter: blur(12px);

    transform:
        translateY(12px)
        scale(.96);

    transition:
        opacity 1.1s var(--ease),
        filter 1.1s var(--ease),
        transform 1.3s var(--ease);
}

.lyric.visible {
    opacity: .98;
    filter: blur(0);
    transform:
        translateY(0)
        scale(1);
}

/* =========================================================
   FINAL LYRIC BLACK PAUSE
========================================================= */

#endingScreen {
    position: fixed;
    inset: 0;

    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 2.5s ease,
        visibility 2.5s ease;
}

#endingScreen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.scroll-indicator {
    position: absolute;

    left: 50%;
    bottom: 8vh;

    transform: translateX(-50%);

    text-align: center;

    opacity: 0;

    transition: opacity 3s ease;
}

#endingScreen.show-indicator .scroll-indicator {
    opacity: 1;
}

.scroll-arrow {
    display: block;

    margin-bottom: 12px;

    color: rgba(237,232,226,.62);

    font-family: Georgia, serif;
    font-size: 20px;

    animation: arrowFloat 2.6s ease-in-out infinite;
}

.scroll-text {
    color: rgba(184,177,170,.55);

    font-family: Georgia, "Times New Roman", serif;

    font-size: 11px;

    letter-spacing: .2em;
    text-transform: lowercase;
}

@keyframes arrowFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(6px);
    }
}

/* =========================================================
   LETTER SECTION
========================================================= */

#letterSection {
    position: relative;

    width: 100%;
    min-height: 190vh;

    background: #050505;

    z-index: 10;

    padding:
        28vh
        clamp(28px, 8vw, 130px)
        20vh;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 2s ease,
        visibility 2s ease;
}

#letterSection.revealed {
    opacity: 1;
    visibility: visible;
}

.letter-wrap {
    position: relative;

    width: min(760px, 90vw);

    min-height: 850px;

    display: flex;
    flex-direction: column;

    justify-content: center;

    padding:
        10vh
        clamp(5px, 3vw, 30px);
}

.letter-line {
    margin: 0 0 30px;

    color: rgba(237,232,226,.87);

    font-family: "Qwitcher Grypen", cursive;

    font-size: clamp(31px, 4vw, 50px);

    line-height: 1.15;

    letter-spacing: .01em;

    opacity: 0;
    filter: blur(8px);

    transform: translateY(25px);

    transition:
        opacity 1.8s var(--ease),
        filter 1.8s var(--ease),
        transform 1.8s var(--ease);
}

.letter-line.visible {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
}

.letter-gap {
    height: 35px;
}

.signature {
    position: absolute;

    right: 0;
    bottom: 4vh;

    color: rgba(237,232,226,.88);

    font-family: "Qwitcher Grypen", cursive;

    font-size: clamp(42px, 6vw, 68px);

    line-height: 1;

    transform: rotate(-4deg);

    opacity: 0;
    filter: blur(7px);

    transition:
        opacity 2s ease,
        filter 2s ease;
}

.signature.visible {
    opacity: 1;
    filter: blur(0);
}

/* =========================================================
   FINAL EMPTY SPACE
========================================================= */

.letter-end {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 15vh;

    pointer-events: none;
}

/* =========================================================
   RESPONSIVE — TABLET
========================================================= */

@media (max-width: 900px) {

    .lyric {
        font-size: clamp(25px, 5vw, 42px);
        line-height: 2;
    }

    .letter-wrap {
        min-height: 760px;
    }

    .letter-line {
        font-size: clamp(29px, 6vw, 46px);
    }
}

/* =========================================================
   RESPONSIVE — MOBILE
========================================================= */

@media (max-width: 600px) {

    html,
    body {
        width: 100%;
        overflow-x: hidden;
    }

    .password-wrap {
        width: 82vw;
    }

    .password-title {
        font-size: 17px;
        margin-bottom: 29px;
    }

    .password-input {
        height: 48px;
        font-size: 15px;
    }

    .enter-btn {
        margin-top: 26px;
        height: 44px;
        min-width: 108px;
    }

    .wish-title {
        width: 90vw;
        font-size: clamp(56px, 17vw, 88px);
    }

    .lyric-stage {
        padding:
            30px
            22px
            45px;
    }

    .lyric {
        width: 92vw;

        font-size: clamp(22px, 6.4vw, 31px);

        line-height: 2.15;

        text-shadow:
            0 2px 18px rgba(0,0,0,.9);
    }

    #backgroundVideo {
        inset: -5%;

        width: 110%;
        height: 110%;

        filter:
            brightness(.22)
            contrast(.85)
            saturate(.45)
            blur(1.5px);
    }

    .scroll-indicator {
        bottom: 6vh;
    }

    .scroll-arrow {
        font-size: 19px;
        margin-bottom: 9px;
    }

    .scroll-text {
        font-size: 10px;
        letter-spacing: .17em;
    }

    #letterSection {
        min-height: 180vh;

        padding:
            25vh
            24px
            17vh;
    }

    .letter-wrap {
        width: 100%;
        min-height: 700px;

        padding:
            6vh
            2px;
        }

    .letter-line {
        margin-bottom: 27px;

        font-size: clamp(30px, 9vw, 43px);

        line-height: 1.18;
    }

    .letter-gap {
        height: 27px;
    }

    .signature {
        right: 2px;
        bottom: 3vh;

        font-size: clamp(42px, 13vw, 62px);
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .lyric {
        font-size: 21px;
    }

    .letter-line {
        font-size: 29px;
    }

    .signature {
        font-size: 43px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         PASSWORD SCREEN
    ====================================================== -->

    <section id="passwordScreen" class="screen active">

        <div class="password-wrap">

            <div class="password-title">
                Enter Password
            </div>

            <form id="passwordForm" class="password-form">

                <input
                    id="passwordInput"
                    class="password-input"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Password"
                    placeholder="••••••••"
                >

                <button
                    type="submit"
                    class="enter-btn"
                >
                    Enter
                </button>

                <div
                    id="passwordError"
                    class="password-error"
                    aria-live="polite"
                >
                    That isn't the right password.
                </div>

            </form>

        </div>

    </section>


    <!-- =====================================================
         ONE LAST WISH
    ====================================================== -->

    <section id="wishScreen" class="screen">

        <div class="wish-content">

            <div class="wish-title qwitcher-grypen-regular">
                One Last Wish
            </div>

        </div>

    </section>


    <!-- =====================================================
         BEGIN
    ====================================================== -->

    <section id="beginScreen" class="screen">

        <div class="begin-wrap">

            <button
                id="beginButton"
                class="begin-btn"
                type="button"
            >
                Begin
            </button>

        </div>

    </section>


    <!-- =====================================================
         CINEMATIC EXPERIENCE
    ====================================================== -->

    <main id="experience">

        <video
            id="backgroundVideo"
            src="song.mp4"
            poster="cover.jpg"
            playsinline
            preload="auto"
            aria-hidden="true"
        ></video>

        <div class="video-overlay"></div>
        <div class="video-vignette"></div>

        <div class="lyric-stage">
            <div
                id="lyric"
                class="lyric noto-nastaliq-urdu"
            ></div>
        </div>

    </main>


    <!-- =====================================================
         ENDING / SCROLL INDICATOR
    ====================================================== -->

    <section id="endingScreen">

        <div class="scroll-indicator">

            <span class="scroll-arrow">↓</span>

            <span class="scroll-text">
                scroll down
            </span>

        </div>

    </section>


    <!-- =====================================================
         FINAL LETTER
    ====================================================== -->

    <section id="letterSection">

        <div class="letter-wrap">

            <p class="letter-line">
                Maybe some things are better left unsaid.
            </p>

            <p class="letter-line">
                Maybe some feelings are meant to stay
            </p>

            <p class="letter-line">
                between the words,
            </p>

            <p class="letter-line">
                the silence,
            </p>

            <p class="letter-line">
                and the memories.
            </p>

            <div class="letter-gap"></div>

            <p class="letter-line">
                So this isn't goodbye.
            </p>

            <p class="letter-line">
                Just one last wish...
            </p>

            <p class="letter-line">
                Stay.
            </p>

            <div
                id="signature"
                class="signature qwitcher-grypen-regular"
            >
                Isba Eman
            </div>

        </div>

        <div class="letter-end"></div>

    </section>

</div>


<script>
/* =========================================================
   CONFIGURATION
========================================================= */

const PASSWORD = "2322007";

/*
    EDIT YOUR LYRICS AND TIMES HERE.

    "time" = exact second in song.mp4
*/
const lyrics = [
    {
        time: 0,
        text: "Chhod ke jaane ki baatein kiya na karo"
    },

    {
        time: 4,
        text: "Haal-e-dil samjho zara, vaade kiya na karo"
    },

    {
        time: 9,
        text: "Khamoshiyon mein bhi alfaaz tu chun lena"
    },

    {
        time: 14,
        text: "Baahon mein jab bharoon dhadkan meri sun lena"
    },

    {
        time: 19,
        text: "Ye aankhein meri kehti hain ke tu theher ja"
    },

    {
        time: 24,
        text: "Adhoora sa yeh ghar lagega tere bina"
    },

    {
        time: 29,
        text: "Ye aankhein meri kehti hain ke tu theher ja"
    },

    {
        time: 34,
        text: "Adhoora sa yeh ghar lagega tere bina"
    },

    {
        time: 39,
        text: "Behti hawaaon ko rok nahin, par saanson mein bhar sakte ho"
    },

    {
        time: 46,
        text: "Dil se nikalta na koi kisike, par khone se darr sakte ho"
    },

    {
        time: 53,
        text: "Kehne ko kitna bacha, kaise karoon main bayaan"
    },

    {
        time: 60,
        text: "Hum milenge phir se kabhi, aasmaan pe hogi jagah"
    },

    {
        time: 67,
        text: "Ye aankhein meri kehti hain ke tu theher ja"
    },

    {
        time: 72,
        text: "Adhoora sa yeh ghar lagega tere bina"
    },

    {
        time: 77,
        text: "Ye aankhein meri kehti hain ke tu theher ja"
    },

    {
        time: 82,
        text: "Adhoora sa yeh ghar lagega tere bina"
    }
];


/* =========================================================
   ELEMENTS
========================================================= */

const passwordScreen =
    document.getElementById("passwordScreen");

const passwordForm =
    document.getElementById("passwordForm");

const passwordInput =
    document.getElementById("passwordInput");

const passwordError =
    document.getElementById("passwordError");

const wishScreen =
    document.getElementById("wishScreen");

const beginScreen =
    document.getElementById("beginScreen");

const beginButton =
    document.getElementById("beginButton");

const experience =
    document.getElementById("experience");

const video =
    document.getElementById("backgroundVideo");

const lyricElement =
    document.getElementById("lyric");

const endingScreen =
    document.getElementById("endingScreen");

const letterSection =
    document.getElementById("letterSection");

const letterLines =
    document.querySelectorAll(".letter-line");

const signature =
    document.getElementById("signature");


/* =========================================================
   STATE
========================================================= */

let currentLyricIndex = -1;
let experienceStarted = false;
let endingStarted = false;


/* =========================================================
   PASSWORD
========================================================= */

passwordForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const enteredPassword =
        passwordInput.value.trim();

    if (enteredPassword === PASSWORD) {

        passwordError.classList.remove("show");

        passwordScreen.classList.remove("active");

        setTimeout(() => {

            wishScreen.classList.add("active");

            requestAnimationFrame(() => {
                wishScreen.classList.add("show-title");
            });

            /*
                Hold "One Last Wish" for a cinematic pause.
            */
            setTimeout(() => {

                wishScreen.classList.remove("show-title");

                setTimeout(() => {

                    wishScreen.classList.remove("active");

                    setTimeout(() => {
                        beginScreen.classList.add("active");
                    }, 900);

                }, 2200);

            }, 3900);

        }, 1000);

    } else {

        passwordError.classList.add("show");

        passwordInput.value = "";

        passwordInput.focus();

        /*
            Small cinematic shake.
        */
        passwordInput.animate(
            [
                { transform: "translateX(0)" },
                { transform: "translateX(-5px)" },
                { transform: "translateX(5px)" },
                { transform: "translateX(-3px)" },
                { transform: "translateX(0)" }
            ],
            {
                duration: 380,
                easing: "ease-out"
            }
        );
    }
});


/* =========================================================
   BEGIN EXPERIENCE
========================================================= */

beginButton.addEventListener("click", async function() {

    if (experienceStarted) return;

    experienceStarted = true;

    /*
        Fade Begin screen away.
    */

    beginScreen.classList.remove("active");

    setTimeout(() => {

        experience.classList.add("active");

        /*
            Start local video/audio.
            Browser allows this because it happens
            directly inside the user's click.
        */

        video.currentTime = 0;

        const playPromise = video.play();

        if (playPromise !== undefined) {

            playPromise.catch(() => {
                /*
                    If the browser blocks playback,
                    the user can simply click again.
                */
            });
        }

    }, 850);

});


/* =========================================================
   LYRIC ENGINE
========================================================= */

function getLyricIndex(currentTime) {

    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {

        if (currentTime >= lyrics[i].time) {
            index = i;
        } else {
            break;
        }
    }

    return index;
}


function showLyric(index) {

    if (index < 0 || index >= lyrics.length) {
        return;
    }

    /*
        Fade old lyric away first.
    */

    lyricElement.classList.remove("visible");

    setTimeout(() => {

        lyricElement.textContent =
            lyrics[index].text;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                lyricElement.classList.add("visible");
            });
        });

    }, 450);
}


function syncLyrics() {

    if (!experienceStarted || endingStarted) {
        return;
    }

    const currentTime = video.currentTime;

    const index =
        getLyricIndex(currentTime);

    if (index !== currentLyricIndex) {

        currentLyricIndex = index;

        if (index >= 0) {
            showLyric(index);
        }
    }

    /*
        Detect final lyric.
    */

    if (
        currentLyricIndex === lyrics.length - 1 &&
        currentTime >= lyrics[lyrics.length - 1].time
    ) {

        const finalDuration =
            video.duration && isFinite(video.duration)
                ? video.duration
                : lyrics[lyrics.length - 1].time + 8;

        /*
            Let final lyric breathe before ending.
        */

        if (
            currentTime >=
            Math.min(
                finalDuration - 1.2,
                lyrics[lyrics.length - 1].time + 5
            )
        ) {
            beginEnding();
        }
    }
}


/* =========================================================
   MEDIA TIME SYNC
========================================================= */

video.addEventListener(
    "timeupdate",
    syncLyrics
);

video.addEventListener(
    "seeking",
    function() {

        if (!experienceStarted) return;

        const index =
            getLyricIndex(video.currentTime);

        currentLyricIndex = index;

        if (index >= 0) {

            lyricElement.textContent =
                lyrics[index].text;

            lyricElement.classList.add("visible");
        } else {

            lyricElement.textContent = "";

            lyricElement.classList.remove("visible");
        }
    }
);


/* =========================================================
   MEDIA END
========================================================= */

video.addEventListener(
    "ended",
    function() {
        beginEnding();
    }
);


/* =========================================================
   FINAL LYRIC → BLACK
========================================================= */

function beginEnding() {

    if (endingStarted) return;

    endingStarted = true;

    lyricElement.classList.remove("visible");

    setTimeout(() => {

        /*
            Stop media quietly.
        */

        video.pause();

        /*
            Fade cinematic experience away.
        */

        experience.classList.remove("active");

        setTimeout(() => {

            endingScreen.classList.add("active");

            /*
                A few seconds of almost complete blackness.
            */

            setTimeout(() => {

                endingScreen.classList.add(
                    "show-indicator"
                );

            }, 2800);

        }, 1700);

    }, 1300);
}


/* =========================================================
   SCROLL → LETTER
========================================================= */

let letterOpened = false;

function openLetter() {

    if (letterOpened) return;

    const scrollPosition =
        window.scrollY ||
        window.pageYOffset;

    /*
        Only allow opening once the ending
        section is actually reached.
    */

    if (scrollPosition < window.innerHeight * .55) {
        return;
    }

    letterOpened = true;

    endingScreen.classList.remove("active");

    setTimeout(() => {

        letterSection.classList.add("revealed");

        /*
            Scroll naturally into the letter.
        */

        setTimeout(() => {

            letterSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }, 350);

    }, 700);
}


window.addEventListener(
    "scroll",
    function() {

        if (!endingStarted || letterOpened) {
            return;
        }

        /*
            Once the user starts moving down,
            reveal the letter.
        */

        if (window.scrollY > window.innerHeight * .25) {
            openLetter();
        }
    },
    { passive: true }
);


/* =========================================================
   LETTER SCROLL ANIMATION
========================================================= */

const letterObserver =
    new IntersectionObserver(
        (entries) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add(
                        "visible"
                    );

                    letterObserver.unobserve(
                        entry.target
                    );
                }
            });

        },
        {
            threshold: .25,
            rootMargin: "0px 0px -8% 0px"
        }
    );


letterLines.forEach(line => {
    letterObserver.observe(line);
});


const signatureObserver =
    new IntersectionObserver(
        (entries) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    signature.classList.add(
                        "visible"
                    );

                    signatureObserver.unobserve(
                        signature
                    );
                }
            });

        },
        {
            threshold: .5
        }
    );


signatureObserver.observe(signature);


/* =========================================================
   KEYBOARD ENTER SUPPORT
========================================================= */

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            passwordForm.requestSubmit();
        }
    }
);


/* =========================================================
   PREVENT ACCIDENTAL CONTEXT MENU ON EXPERIENCE
========================================================= */

experience.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);
</script>
