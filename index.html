<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>One Last Wish</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: "Playfair Display", serif;
}


/* =========================================================
   PASSWORD SCREEN
========================================================= */

.password-screen {
    position: fixed;
    inset: 0;

    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #151515 0%,
            #080808 42%,
            #000 100%
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.password-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.password-content {
    width: min(90%, 420px);

    text-align: center;
}

.password-small {
    font-size: 10px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: rgba(255,255,255,.42);

    margin-bottom: 25px;
}

.password-title {
    font-size: clamp(30px, 6vw, 48px);

    font-weight: 400;

    letter-spacing: 1px;

    margin-bottom: 34px;
}

.password-form {
    display: flex;

    width: 100%;

    border-bottom:
        1px solid rgba(255,255,255,.25);

    transition:
        border-color .3s ease;
}

.password-form:focus-within {
    border-color:
        rgba(255,255,255,.75);
}

.password-input {
    flex: 1;

    min-width: 0;

    padding: 14px 4px;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    text-align: center;

    font-size: 18px;

    letter-spacing: 6px;

    font-family: Arial, sans-serif;
}

.password-input::placeholder {
    color: rgba(255,255,255,.25);

    letter-spacing: 3px;
}

.password-button {
    width: 48px;

    border: none;

    background: transparent;

    color: rgba(255,255,255,.65);

    font-size: 21px;

    cursor: pointer;

    transition:
        color .25s ease,
        transform .25s ease;
}

.password-button:hover {
    color: white;

    transform: translateX(3px);
}

.password-error {
    min-height: 22px;

    margin-top: 15px;

    font-family: Arial, sans-serif;

    font-size: 11px;

    color: rgba(255,255,255,.5);

    opacity: 0;

    transition: opacity .3s ease;
}

.password-error.show {
    opacity: 1;
}


/* =========================================================
   WISH SCREEN
========================================================= */

.wish-screen {
    position: fixed;
    inset: 0;

    z-index: 9000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.wish-screen.show {
    opacity: 1;
    visibility: visible;
}

.wish-text {
    font-size: clamp(28px, 5vw, 58px);

    font-weight: 400;

    letter-spacing: 3px;

    text-align: center;

    color: rgba(255,255,255,.94);

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        opacity 1.4s ease,
        transform 1.4s ease;
}

.wish-screen.show .wish-text {
    opacity: 1;

    transform:
        translateY(0);
}

.wish-text.fade-out {
    opacity: 0;

    transform:
        translateY(-20px);
}


/* =========================================================
   MAIN EXPERIENCE
========================================================= */

.main {
    position: fixed;
    inset: 0;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}

.main.show {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   ATMOSPHERIC BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: -70px;

    z-index: -5;

    background:
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(0,0,0,.9)
        ),
        url("cover.jpg") center/cover no-repeat;

    filter: blur(30px);

    transform: scale(1.1);

    animation:
        backgroundMove 18s ease-in-out infinite alternate;
}

@keyframes backgroundMove {

    from {
        transform: scale(1.1);
    }

    to {
        transform: scale(1.16);
    }
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page {
    width: 100%;
    height: 100%;

    padding:
        25px
        28px
        max(25px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    width: 100%;
    max-width: 1400px;

    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: relative;

    z-index: 10;
}

.brand {
    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: rgba(255,255,255,.42);
}

.song-info {
    text-align: right;
}

.song-title {
    font-size: 17px;

    letter-spacing: 1px;
}

.artist {
    margin-top: 4px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: rgba(255,255,255,.45);
}


/* =========================================================
   VIDEO
========================================================= */

.video-area {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
}

.video-box {
    position: relative;

    width: min(1200px, 100%);

    aspect-ratio: 16 / 9;

    overflow: hidden;

    border-radius: 18px;

    background: #000;

    box-shadow:
        0 35px 100px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.07);
}

.video-box video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background: #000;
}


/* =========================================================
   CINEMATIC VIDEO OVERLAY
========================================================= */

.video-box::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 2;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.22),
            transparent 30%,
            transparent 60%,
            rgba(0,0,0,.58)
        );
}


/* =========================================================
   LYRIC
========================================================= */

.lyric-container {
    position: absolute;

    inset: 0;

    z-index: 4;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 35px;

    pointer-events: none;
}

.lyric {
    max-width: 92%;

    direction: rtl;

    text-align: center;

    font-family:
        "Noto Naskh Arabic",
        "Noto Nastaliq Urdu",
        serif;

    font-size: 50px;

    font-weight: 600;

    line-height: 1.85;

    color: #fff;

    text-shadow:
        0 3px 12px rgba(0,0,0,.95),
        0 8px 35px rgba(0,0,0,.7);

    opacity: 0;

    transform:
        translateY(25px)
        scale(.96);

    transition:
        opacity .7s ease,
        transform .8s cubic-bezier(.22,.61,.36,1);

    will-change:
        opacity,
        transform;
}

.lyric.visible {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

.lyric.leaving {
    opacity: 0;

    transform:
        translateY(-22px)
        scale(1.015);
}


/* =========================================================
   PLAY BUTTON
========================================================= */

.center-play {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 70px;
    height: 70px;

    z-index: 7;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.3);

    background:
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(15px);

    color: white;

    font-size: 22px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        opacity .35s ease,
        transform .35s ease,
        background .35s ease;
}

.center-play:hover {
    background:
        rgba(255,255,255,.1);

    transform:
        translate(-50%, -50%)
        scale(1.08);
}

.center-play.hidden {
    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 8;

    padding:
        20px
        20px
        18px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.8)
        );

    opacity: 0;

    transform:
        translateY(8px);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.video-box:hover .controls,
.video-box.paused .controls,
.controls:hover {
    opacity: 1;

    transform:
        translateY(0);
}


/* progress */

.progress {
    appearance: none;

    width: 100%;

    height: 3px;

    margin-bottom: 11px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.25);

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: white;
}

.progress::-moz-range-thumb {
    width: 11px;
    height: 11px;

    border: none;

    border-radius: 50%;

    background: white;
}


/* control row */

.control-row {
    display: flex;

    align-items: center;

    gap: 10px;
}

.control-btn {
    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;

    opacity: .82;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.control-btn:hover {
    opacity: 1;

    transform:
        scale(1.08);
}

.time {
    font-family: Arial, sans-serif;

    font-size: 10px;

    color:
        rgba(255,255,255,.7);

    white-space: nowrap;
}

.volume {
    width: 70px;

    appearance: none;

    height: 3px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.25);
}

.volume::-webkit-slider-thumb {
    appearance: none;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;
}

.volume::-moz-range-thumb {
    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: white;
}

.spacer {
    flex: 1;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    width: 100%;
    max-width: 1200px;

    margin: 14px auto 0;

    display: flex;

    justify-content: space-between;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.3);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .page {
        padding:
            16px
            12px
            max(15px, env(safe-area-inset-bottom));
    }

    .brand {
        font-size: 8px;

        letter-spacing: 2px;
    }

    .song-title {
        font-size: 14px;
    }

    .artist {
        font-size: 7px;
    }

    .video-box {
        border-radius: 11px;

        aspect-ratio: 16 / 10;
    }

    .lyric-container {
        padding: 18px;
    }

    .lyric {
        max-width: 95%;

        font-size:
            clamp(28px, 8vw, 42px);

        line-height: 1.9;
    }

    .center-play {
        width: 58px;
        height: 58px;

        font-size: 18px;
    }

    .controls {
        opacity: 1;

        transform: none;

        padding:
            14px
            11px
            max(11px, env(safe-area-inset-bottom));
    }

    .volume {
        width: 50px;
    }

    .footer {
        font-size: 6px;

        margin-top: 9px;
    }

    .password-title {
        font-size: 34px;
    }

    .password-small {
        font-size: 8px;

        letter-spacing: 3px;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 390px) {

    .lyric {
        font-size: 27px;
    }

    .volume {
        display: none;
    }

    .time {
        font-size: 9px;
    }
}


/* =========================================================
   FULLSCREEN
========================================================= */

.video-box:fullscreen {
    width: 100vw;
    height: 100vh;

    border-radius: 0;
}

.video-box:fullscreen video {
    object-fit: contain;
}

</style>
</head>


<body>


<!-- =======================================================
     PASSWORD
======================================================= -->

<section class="password-screen" id="passwordScreen">

    <div class="password-content">

        <div class="password-small">
            A private experience
        </div>

        <h1 class="password-title">
            Enter Password
        </h1>

        <form class="password-form" id="passwordForm">

            <input
                type="password"
                id="passwordInput"
                class="password-input"
                placeholder="••••••••"
                autocomplete="off"
                inputmode="numeric"
            >

            <button
                type="submit"
                class="password-button"
                aria-label="Enter">
                →
            </button>

        </form>

        <div
            class="password-error"
            id="passwordError">
            Incorrect password
        </div>

    </div>

</section>


<!-- =======================================================
     ONE LAST WISH
======================================================= -->

<section class="wish-screen" id="wishScreen">

    <div
        class="wish-text"
        id="wishText">
        One Last Wish
    </div>

</section>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main" id="main">

    <div class="background"></div>

    <div class="page">


        <!-- HEADER -->

        <header class="topbar">

            <div class="brand">
                One Last Wish
            </div>

            <div class="song-info">

                <div class="song-title">
                    Theher Ja
                </div>

                <div class="artist">
                    Garvit Soni · Priyansh Srivastava
                </div>

            </div>

        </header>


        <!-- VIDEO -->

        <section class="video-area">

            <div
                class="video-box paused"
                id="videoBox">

                <video
                    id="video"
                    playsinline
                    preload="metadata"
                    poster="cover.jpg">

                    <source
                        src="song.mp4"
                        type="video/mp4">

                    Your browser does not support video.
                </video>


                <!-- ONLY ONE LYRIC EXISTS HERE -->

                <div class="lyric-container">

                    <div
                        class="lyric"
                        id="lyric">
                    </div>

                </div>


                <!-- CENTER PLAY -->

                <button
                    class="center-play"
                    id="centerPlay"
                    aria-label="Play">

                    <span id="centerPlayIcon">
                        ▶
                    </span>

                </button>


                <!-- CONTROLS -->

                <div class="controls">

                    <input
                        type="range"
                        id="progress"
                        class="progress"
                        min="0"
                        max="100"
                        value="0"
                        step="0.01"
                    >

                    <div class="control-row">

                        <button
                            class="control-btn"
                            id="playBtn">
                            ▶
                        </button>

                        <span
                            class="time"
                            id="currentTime">
                            00:00
                        </span>

                        <span
                            class="time">
                            /
                        </span>

                        <span
                            class="time"
                            id="duration">
                            00:00
                        </span>

                        <button
                            class="control-btn"
                            id="muteBtn">
                            🔊
                        </button>

                        <input
                            type="range"
                            class="volume"
                            id="volume"
                            min="0"
                            max="1"
                            value="1"
                            step="0.01"
                        >

                        <div class="spacer"></div>

                        <button
                            class="control-btn"
                            id="fullscreenBtn">
                            ⛶
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- FOOTER -->

        <footer class="footer">

            <span>
                A Song In Motion
            </span>

            <span>
                Isba Eman
            </span>

        </footer>

    </div>

</main>


<script>

/* =========================================================
   PASSWORD
========================================================= */

const CORRECT_PASSWORD = "2322007";

const passwordScreen =
    document.getElementById("passwordScreen");

const passwordForm =
    document.getElementById("passwordForm");

const passwordInput =
    document.getElementById("passwordInput");

const passwordError =
    document.getElementById("passwordError");

const wishScreen =
    document.getElementById("wishScreen");

const wishText =
    document.getElementById("wishText");

const main =
    document.getElementById("main");


passwordInput.focus();


passwordForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const entered =
            passwordInput.value.trim();

        if (entered === CORRECT_PASSWORD) {

            passwordError.classList.remove("show");

            passwordScreen.classList.add("hidden");

            setTimeout(
                () => {

                    wishScreen.classList.add("show");

                },
                500
            );


            /*
               "One Last Wish" stays visible
               for a cinematic moment.
            */

            setTimeout(
                () => {

                    wishText.classList.add("fade-out");

                },
                2600
            );


            /*
               Then reveal the actual
               video experience.
            */

            setTimeout(
                () => {

                    wishScreen.classList.remove("show");

                    main.classList.add("show");

                    /*
                       Start video after user has
                       interacted with password screen.
                    */

                    video.play().catch(
                        () => {

                            /*
                               If browser blocks autoplay,
                               user can press play.
                            */

                        }
                    );

                },
                3600
            );

        } else {

            passwordError.textContent =
                "Incorrect password";

            passwordError.classList.add("show");

            passwordInput.value = "";

            passwordInput.focus();

        }

    }
);


/* =========================================================
   VIDEO
========================================================= */

const video =
    document.getElementById("video");

const videoBox =
    document.getElementById("videoBox");

const playBtn =
    document.getElementById("playBtn");

const centerPlay =
    document.getElementById("centerPlay");

const centerPlayIcon =
    document.getElementById("centerPlayIcon");

const progress =
    document.getElementById("progress");

const currentTimeEl =
    document.getElementById("currentTime");

const durationEl =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const muteBtn =
    document.getElementById("muteBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const lyric =
    document.getElementById("lyric");


/* =========================================================

=========================================================

const lyrics = [

/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);


centerPlay.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   PLAY STATE
========================================================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

        centerPlayIcon.textContent = "❚❚";

        centerPlay.classList.add("hidden");

        videoBox.classList.remove("paused");

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

        centerPlayIcon.textContent = "▶";

        centerPlay.classList.remove("hidden");

        videoBox.classList.add("paused");

    }
);


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(secondsPart).padStart(2, "0")
    );

}


/* =========================================================
   VIDEO METADATA
========================================================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        durationEl.textContent =
            formatTime(video.duration);

    }
);


/* =========================================================
   FIND CURRENT LYRIC
========================================================= */

function findCurrentLyric(time) {

    let index = -1;

    for (
        let i = 0;
        i < lyrics.length;
        i++
    ) {

        if (time >= lyrics[i].time) {

            index = i;

        } else {

            break;

        }

    }

    return index;

}


/* =========================================================
   LYRIC STATE
========================================================= */

let currentLyric = -1;

let lyricChangeTimer;


/* =========================================================
   CHANGE LYRIC
========================================================= */

function changeLyric(index) {

    if (
        index < 0
        ||
        index >= lyrics.length
    ) {

        hideLyric();

        return;

    }


    clearTimeout(lyricChangeTimer);


    /*
       First fade current lyric away.
    */

    lyric.classList.remove("visible");

    lyric.classList.add("leaving");


    /*
       Then replace it with the next lyric.
    */

    lyricChangeTimer =
        setTimeout(
            () => {

                lyric.textContent =
                    lyrics[index].text;

                lyric.classList.remove("leaving");

                void lyric.offsetWidth;

                lyric.classList.add("visible");

            },
            250
        );

}


/* =========================================================
   HIDE LYRIC
========================================================= */

function hideLyric() {

    clearTimeout(lyricChangeTimer);

    lyric.classList.remove("visible");

    lyric.classList.add("leaving");

}


/* =========================================================
   SYNC LYRICS
========================================================= */

function updateLyrics() {

    const index =
        findCurrentLyric(video.currentTime);

    if (index !== currentLyric) {

        currentLyric = index;

        changeLyric(index);

    }

}


/* =========================================================
   VIDEO TIME UPDATE
========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        if (video.duration) {

            progress.value =
                (
                    video.currentTime
                    /
                    video.duration
                ) * 100;

        }

        currentTimeEl.textContent =
            formatTime(video.currentTime);

        updateLyrics();

    }
);


/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "input",
    () => {

        if (!video.duration) {
            return;
        }

        video.currentTime =
            (
                Number(progress.value)
                /
                100
            )
            *
            video.duration;

        updateLyrics();

    }
);


video.addEventListener(
    "seeking",
    () => {

        updateLyrics();

    }
);


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted = false;

        updateMuteIcon();

    }
);


/* =========================================================
   MUTE
========================================================= */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

    }
);


function updateMuteIcon() {

    if (
        video.muted
        ||
        video.volume === 0
    ) {

        muteBtn.textContent = "🔇";

    } else {

        muteBtn.textContent = "🔊";

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoBox.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(error);

        }

    }
);


/* =========================================================
   DOUBLE CLICK
========================================================= */

video.addEventListener(
    "dblclick",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoBox.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(error);

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.target.tagName === "INPUT"
        ) {
            return;
        }


        if (event.code === "Space") {

            event.preventDefault();

            togglePlay();

        }


        if (event.code === "ArrowRight") {

            video.currentTime =
                Math.min(
                    video.duration || 0,
                    video.currentTime + 5
                );

            updateLyrics();

        }


        if (event.code === "ArrowLeft") {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            updateLyrics();

        }


        if (
            event.key.toLowerCase()
            ===
            "m"
        ) {

            video.muted =
                !video.muted;

            updateMuteIcon();

        }


        if (
            event.key.toLowerCase()
            ===
            "f"
        ) {

            fullscreenBtn.click();

        }

    }
);


/* =========================================================
   VIDEO END
========================================================= */

video.addEventListener(
    "ended",
    () => {

        hideLyric();

        currentLyric = -1;

    }
);


/* =========================================================
   INITIAL
========================================================= */

video.volume = 1;

volume.value = 1;

updateMuteIcon();

</script>

</body>
</html>
