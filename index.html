<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Theher Ja — Cinematic Lyrics</title>

<!-- Beautiful Urdu font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white: #f8f5ef;
    --muted: rgba(248,245,239,.62);
    --glass: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.14);
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #050505;
    color: var(--white);
    font-family: "Playfair Display", serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: -60px;
    z-index: -3;

    background:
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(0,0,0,.88)
        ),
        url("cover.jpg") center/cover no-repeat;

    filter: blur(28px);
    transform: scale(1.08);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0,0,0,.45) 55%,
            rgba(0,0,0,.85) 100%
        );
}

/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    flex-direction: column;

    padding:
        28px
        28px
        max(28px, env(safe-area-inset-bottom));

    position: relative;
}

/* =========================
   TOP
========================= */

.topbar {
    width: 100%;
    max-width: 1450px;
    margin: 0 auto 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: relative;
    z-index: 5;
}

.brand {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,.58);
}

.song-info {
    text-align: right;
}

.song-title {
    font-size: 18px;
    letter-spacing: 1px;
}

.artist {
    margin-top: 3px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
}

/* =========================
   VIDEO AREA
========================= */

.video-stage {
    width: 100%;
    max-width: 1450px;

    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto;
}

.video-box {
    width: min(1180px, 100%);
    aspect-ratio: 16 / 9;

    position: relative;

    overflow: hidden;
    border-radius: 18px;

    background: #000;

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.07);

    isolation: isolate;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background: #000;
}

/* cinematic darkness over video */

.video-box::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            transparent 30%,
            transparent 62%,
            rgba(0,0,0,.48)
        );

    z-index: 1;
}

/* =========================
   LYRIC OVERLAY
========================= */

.lyrics-layer {
    position: absolute;
    inset: 0;

    z-index: 3;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px;

    pointer-events: none;
}

.lyric {
    max-width: 92%;

    color: #fff;

    direction: rtl;
    text-align: center;

    font-family:
        "Noto Naskh Arabic",
        "Noto Nastaliq Urdu",
        serif;

    font-size: 50px;
    font-weight: 600;

    line-height: 1.8;

    letter-spacing: 0;

    text-shadow:
        0 3px 12px rgba(0,0,0,.85),
        0 8px 35px rgba(0,0,0,.6);

    opacity: 0;
    transform:
        translateY(20px)
        scale(.97);

    transition:
        opacity .65s ease,
        transform .8s cubic-bezier(.22,.61,.36,1);

    will-change: opacity, transform;
}

.lyric.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

.lyric.hide {
    opacity: 0;

    transform:
        translateY(-18px)
        scale(1.015);
}

/* =========================
   CENTER PLAY
========================= */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border: 1px solid rgba(255,255,255,.28);
    border-radius: 50%;

    background: rgba(0,0,0,.28);
    backdrop-filter: blur(14px);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 5;

    transition:
        opacity .35s ease,
        transform .35s ease,
        background .35s ease;
}

.center-play:hover {
    background: rgba(255,255,255,.12);

    transform:
        translate(-50%, -50%)
        scale(1.08);
}

.center-play.hidden {
    opacity: 0;
    pointer-events: none;
}

.play-icon {
    margin-left: 4px;
    font-size: 24px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 6;

    padding: 18px 20px 17px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.72)
        );

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.video-box:hover .controls,
.video-box.paused .controls,
.controls:hover {
    opacity: 1;
    transform: translateY(0);
}

/* progress */

.progress-area {
    width: 100%;
    margin-bottom: 12px;
}

.progress {
    appearance: none;

    width: 100%;
    height: 3px;

    background: rgba(255,255,255,.25);

    border-radius: 10px;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

.progress::-moz-range-thumb {
    width: 11px;
    height: 11px;

    border: none;
    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

/* bottom controls */

.control-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.control-btn {
    width: 34px;
    height: 34px;

    border: none;
    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: .85;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.control-btn:hover {
    opacity: 1;
    transform: scale(1.08);
}

.time {
    font-family: Arial, sans-serif;

    font-size: 11px;
    letter-spacing: .5px;

    color: rgba(255,255,255,.72);

    white-space: nowrap;
}

.volume {
    width: 75px;

    appearance: none;

    height: 3px;

    background: rgba(255,255,255,.28);

    border-radius: 10px;

    cursor: pointer;
}

.volume::-webkit-slider-thumb {
    appearance: none;

    width: 9px;
    height: 9px;

    background: white;
    border-radius: 50%;
}

.volume::-moz-range-thumb {
    width: 9px;
    height: 9px;

    border: none;

    background: white;
    border-radius: 50%;
}

.spacer {
    flex: 1;
}

/* =========================
   FOOTER
========================= */

.footer {
    width: 100%;
    max-width: 1180px;

    margin: 20px auto 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: rgba(255,255,255,.38);

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 2px;

    text-transform: uppercase;
}

.footer span:last-child {
    text-align: right;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        padding: 18px 14px 20px;
    }

    .topbar {
        margin-bottom: 14px;
    }

    .brand {
        font-size: 9px;
        letter-spacing: 2.5px;
    }

    .song-title {
        font-size: 14px;
    }

    .artist {
        font-size: 8px;
        letter-spacing: 1.5px;
    }

    .video-stage {
        align-items: center;
    }

    .video-box {
        border-radius: 12px;
        aspect-ratio: 16 / 10;
    }

    .lyrics-layer {
        padding: 20px;
    }

    .lyric {
        max-width: 95%;

        font-size: clamp(29px, 8vw, 42px);

        line-height: 1.85;

        text-shadow:
            0 2px 9px rgba(0,0,0,.9),
            0 7px 25px rgba(0,0,0,.7);
    }

    .center-play {
        width: 60px;
        height: 60px;
    }

    .play-icon {
        font-size: 20px;
    }

    .controls {
        opacity: 1;
        transform: translateY(0);

        padding:
            14px
            12px
            max(12px, env(safe-area-inset-bottom));
    }

    .volume {
        width: 55px;
    }

    .control-btn {
        width: 30px;
        height: 30px;
    }

    .footer {
        margin-top: 12px;

        font-size: 7px;
        letter-spacing: 1.5px;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 400px) {

    .song-info {
        max-width: 130px;
    }

    .lyric {
        font-size: 28px;
    }

    .time {
        font-size: 9px;
    }

    .volume {
        display: none;
    }
}

/* =========================
   FULLSCREEN
========================= */

.video-box:fullscreen {
    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    border-radius: 0;
}

.video-box:fullscreen video {
    object-fit: contain;
}
</style>
</head>

<body>

<div class="background"></div>

<main class="page">

    <!-- TOP -->
    <header class="topbar">

        <div class="brand">
            Cinematic Lyrics
        </div>

        <div class="song-info">
            <div class="song-title">
                Theher Ja
            </div>

            <div class="artist">
                Garvit Soni · Priyansh Srivastava
            </div>
        </div>

    </header>


    <!-- VIDEO -->
    <section class="video-stage">

        <div class="video-box" id="videoBox">

            <video
                id="video"
                playsinline
                preload="metadata"
                poster="cover.jpg">

                <source src="song.mp4" type="video/mp4">

                Your browser does not support the video element.
            </video>


            <!-- LYRIC -->
            <div class="lyrics-layer">

                <div
                    class="lyric"
                    id="lyricText"
                    aria-live="polite">
                </div>

            </div>


            <!-- CENTER PLAY -->
            <button
                class="center-play"
                id="centerPlay"
                aria-label="Play">

                <span
                    class="play-icon"
                    id="centerPlayIcon">
                    ▶
                </span>

            </button>


            <!-- CONTROLS -->
            <div class="controls">

                <div class="progress-area">

                    <input
                        class="progress"
                        id="progress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.01">

                </div>


                <div class="control-row">

                    <button
                        class="control-btn"
                        id="playBtn"
                        aria-label="Play">

                        ▶
                    </button>


                    <div
                        class="time"
                        id="currentTime">
                        00:00
                    </div>

                    <div
                        class="time">
                        /
                    </div>

                    <div
                        class="time"
                        id="duration">
                        00:00
                    </div>


                    <button
                        class="control-btn"
                        id="muteBtn"
                        aria-label="Mute">

                        🔊
                    </button>


                    <input
                        class="volume"
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        value="1"
                        step="0.01">


                    <div class="spacer"></div>


                    <button
                        class="control-btn"
                        id="fullscreenBtn"
                        aria-label="Fullscreen">

                        ⛶
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

        <span>
            A Song In Motion
        </span>

        <span>
            Isba Eman
        </span>

    </footer>

</main>


<script>

/* =========================================================
   VIDEO
========================================================= */

const video = document.getElementById("video");
const videoBox = document.getElementById("videoBox");

const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");
const centerPlayIcon = document.getElementById("centerPlayIcon");

const progress = document.getElementById("progress");

const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

const volume = document.getElementById("volume");
const muteBtn = document.getElementById("muteBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const lyricText =
    document.getElementById("lyricText");


/* =========================================================
   LYRICS

   IMPORTANT:
   Replace the "time" values with the exact timestamps
   of your song.

   Example:
   0      = 00:00
   5.5    = 00:05.5
   12     = 00:12

   The text itself can also be edited here.
========================================================= */

const lyrics = [

    {
        time: 0,
        text: "چھوڑ کے جانے کی باتیں کیا نہ کرو"
    },

    {
        time: 4,
        text: "حالِ دل سمجھو ذرا، وعدے کیا نہ کرو"
    },

    {
        time: 8,
        text: "چھوڑ کے جانے کی باتیں کیا نہ کرو"
    },

    {
        time: 12,
        text: "حالِ دل سمجھو ذرا، وعدے کیا نہ کرو"
    },

    {
        time: 16,
        text: "خاموشیوں میں بھی الفاظ تُو چُن لینا"
    },

    {
        time: 21,
        text: "باہوں میں جب بھروں دھڑکن میری سُن لینا"
    },

    {
        time: 26,
        text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا"
    },

    {
        time: 31,
        text: "ادھورا سا یہ گھر لگے گا تیرے بنا"
    },

    {
        time: 36,
        text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا"
    },

    {
        time: 41,
        text: "ادھورا سا یہ گھر لگے گا تیرے بنا"
    },

    {
        time: 48,
        text: "بہتی ہواؤں کو روک نہیں، پر سانسوں میں بھر سکتے ہو"
    },

    {
        time: 55,
        text: "دل سے نکلتا نہ کوئی کسی کے، پر کھونے سے ڈر سکتے ہو"
    },

    {
        time: 63,
        text: "کہنے کو کتنا بچا، کیسے کروں میں بیاں"
    },

    {
        time: 70,
        text: "ہم ملیں گے پھر سے کبھی، آسمان پہ ہوگی جگہ"
    },

    {
        time: 78,
        text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا"
    },

    {
        time: 83,
        text: "ادھورا سا یہ گھر لگے گا تیرے بنا"
    },

    {
        time: 88,
        text: "یہ آنکھیں میری کہتی ہیں کہ تُو ٹھہر جا"
    },

    {
        time: 93,
        text: "ادھورا سا یہ گھر لگے گا تیرے بنا"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentLyricIndex = -1;
let lyricTimer = null;


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const mins = Math.floor(seconds / 60);

    const secs = Math.floor(seconds % 60);

    return (
        String(mins).padStart(2, "0")
        + ":" +
        String(secs).padStart(2, "0")
    );
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }
}


playBtn.addEventListener(
    "click",
    togglePlay
);


centerPlay.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   PLAY STATE
========================================================= */

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

        centerPlayIcon.textContent = "❚❚";

        centerPlay.classList.add("hidden");

        videoBox.classList.remove("paused");

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

        centerPlayIcon.textContent = "▶";

        centerPlay.classList.remove("hidden");

        videoBox.classList.add("paused");

    }
);


/* =========================================================
   DURATION
========================================================= */

video.addEventListener(
    "loadedmetadata",
    () => {

        durationEl.textContent =
            formatTime(video.duration);

    }
);


/* =========================================================
   PROGRESS
========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        if (video.duration) {

            progress.value =
                (video.currentTime / video.duration) * 100;

        }

        currentTimeEl.textContent =
            formatTime(video.currentTime);

        updateLyrics();

    }
);


progress.addEventListener(
    "input",
    () => {

        if (!video.duration) return;

        video.currentTime =
            (progress.value / 100) * video.duration;

        updateLyrics(true);

    }
);


/* =========================================================
   LYRIC FINDER
========================================================= */

function getLyricIndex(time) {

    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {

        if (time >= lyrics[i].time) {

            index = i;

        } else {

            break;

        }

    }

    return index;
}


/* =========================================================
   SHOW LYRIC
========================================================= */

function showLyric(index) {

    if (index < 0 || index >= lyrics.length) {

        hideLyric();

        return;
    }

    const text = lyrics[index].text;

    /*
       First fade old lyric out.
    */

    lyricText.classList.remove("show");

    lyricText.classList.add("hide");


    clearTimeout(lyricTimer);


    lyricTimer = setTimeout(
        () => {

            lyricText.textContent = text;

            lyricText.classList.remove("hide");

            /*
               Force browser to recognize
               the new animation state.
            */

            void lyricText.offsetWidth;

            lyricText.classList.add("show");

        },
        180
    );
}


/* =========================================================
   HIDE LYRIC
========================================================= */

function hideLyric() {

    clearTimeout(lyricTimer);

    lyricText.classList.remove("show");

    lyricText.classList.add("hide");

}


/* =========================================================
   SYNCHRONIZE LYRICS
========================================================= */

function updateLyrics(force = false) {

    const index =
        getLyricIndex(video.currentTime);

    if (
        index !== currentLyricIndex
        || force
    ) {

        currentLyricIndex = index;

        showLyric(index);

    }

}


/* =========================================================
   SEEKING
========================================================= */

video.addEventListener(
    "seeking",
    () => {

        const index =
            getLyricIndex(video.currentTime);

        if (index !== currentLyricIndex) {

            currentLyricIndex = index;

            showLyric(index);

        }

    }
);


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted = false;

        updateMuteIcon();

    }
);


/* =========================================================
   MUTE
========================================================= */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

    }
);


function updateMuteIcon() {

    if (
        video.muted
        || video.volume === 0
    ) {

        muteBtn.textContent = "🔇";

    } else {

        muteBtn.textContent = "🔊";

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoBox.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================================
   DOUBLE CLICK VIDEO
========================================================= */

video.addEventListener(
    "dblclick",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoBox.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(error);

        }

    }
);


/* =========================================================
   VIDEO CLICK
========================================================= */

video.addEventListener(
    "click",
    () => {

        togglePlay();

    }
);


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        /*
           Don't trigger shortcuts while
           typing into an input.
        */

        if (
            event.target.tagName === "INPUT"
        ) {
            return;
        }


        if (event.code === "Space") {

            event.preventDefault();

            togglePlay();

        }


        if (event.code === "ArrowRight") {

            video.currentTime =
                Math.min(
                    video.duration || 0,
                    video.currentTime + 5
                );

            updateLyrics(true);

        }


        if (event.code === "ArrowLeft") {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

            updateLyrics(true);

        }


        if (event.key.toLowerCase() === "m") {

            video.muted =
                !video.muted;

            updateMuteIcon();

        }


        if (event.key.toLowerCase() === "f") {

            fullscreenBtn.click();

        }

    }
);


/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener(
    "ended",
    () => {

        hideLyric();

        currentLyricIndex = -1;

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

video.volume = 1;

volume.value = 1;

updateMuteIcon();

</script>

</body>
</html>
